#
# AL-LINK USB JTAG Adapter Configuration
#
# Default settings for AL-LINK adapter based on Cypress FX2LP
#

adapter driver al_link

# Default VID/PID for Anlogic AL-Link
al_link_vid_pid 0x336C 0x1001

# Default endpoints
# EP_IN=0x82, EP_OUT=0x06, EP_CFG=0x08
al_link_endpoints 0x82 0x06 0x08

# Default packet size
al_link_packet_size 512

# TDO sample point (high nibble is default)
al_link_sample_nibble high

# Default speed: 2MHz
adapter speed 2000
