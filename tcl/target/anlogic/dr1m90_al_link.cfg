#
# DR1M90 Configuration for AL-LINK Adapter
#
# Usage:
#   openocd -f target/anlogic/dr1m90_al_link.cfg
#

source [find /target/anlogic/init.cfg]
set CONFIG_TARGET_ARM 1

# AL-LINK Adapter Configuration (Anlogic AL-Link VID:PID = 336C:1001)
adapter driver al_link
al_link_vid_pid 0x336C 0x1001

if {[info exists USB_LOCATION]} {
    adapter usb location $USB_LOCATION
}

if {[info exists JTAG_SPEED]} {
    adapter speed $JTAG_SPEED
} else {
    adapter speed 2000
}

transport select jtag

if { [info exists CHIPNAME] } {
  set _CHIPNAME $CHIPNAME
} else {
  set _CHIPNAME dr1m90
}

# DR1M90 JTAG Chain:
#   TAP 0: dummy  - IR length 5
#   TAP 1: apu    - IR length 4, IDCODE 0x5ba00477 (ARM DAP)
#   TAP 2: rsv    - IR length 4
#   TAP 3: fpga   - IR length 8

if {$CONFIG_JTAG == 0} {
    jtag newtap $_CHIPNAME dummy -irlen 5 -ircapture 0x1 -irmask 0x03
    jtag newtap $_CHIPNAME apu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x5ba00477 -enable
    jtag newtap $_CHIPNAME rsv -irlen 4 -ircapture 0x1 -irmask 0xf
    jtag newtap $_CHIPNAME fpga -irlen 8 -ircapture 0xC5 -irmask 0xFF
} elseif {$CONFIG_JTAG == 1} {
    jtag newtap $_CHIPNAME apu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x5ba00477 -enable
}

pld device dr1_90 $_CHIPNAME.fpga

if {$CONFIG_JTAG == 0} {
    target create $_CHIPNAME.pstap pstap -chain-position $_CHIPNAME.rsv
}

if {$CONFIG_TARGET_ARM == 1} {
    echo "target arm"
    dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.apu
    set _TARGETNAME $_CHIPNAME.core
    set _CTINAME $_CHIPNAME.cti
    set DBGBASE {0xF9010000 0xF9012000}
    set CTIBASE {0xF9018000 0xF9019000}
    set _cores 2

    global _quiet_log_depth
    set _quiet_log_depth 0

    proc quiet_log_push {} {
        global _quiet_log_depth _quiet_log_saved_level
        if {$_quiet_log_depth == 0} {
            regexp {(-?[0-9]+)} [debug_level] _quiet_log_saved_level
            debug_level -3
        }
        incr _quiet_log_depth
    }

    proc quiet_log_pop {} {
        global _quiet_log_depth _quiet_log_saved_level
        incr _quiet_log_depth -1
        if {$_quiet_log_depth <= 0} {
            set _quiet_log_depth 0
            debug_level $_quiet_log_saved_level
        }
    }

    proc apu_reset {core_num} {
        global _TARGETNAME
        echo "Reseting: $_TARGETNAME.$core_num"
        quiet_log_push
        catch "mww 0xf8806330 0x1f0"
        sleep 100
        quiet_log_pop
    }

    for {set _core 0 } { $_core < $_cores } { incr _core } {
        cti create $_CTINAME.$_core -dap $_CHIPNAME.dap -ap-num 1 \
            -baseaddr [lindex $CTIBASE $_core]
        target create $_TARGETNAME.$_core aarch64 \
            -dap $_CHIPNAME.dap -coreid $_core \
            -dbgbase [lindex $DBGBASE $_core] -cti $_CTINAME.$_core

        $_TARGETNAME.$_core configure -event reset-assert-pre "halt"
        $_TARGETNAME.$_core configure -event reset-assert "apu_reset $_core"
        $_TARGETNAME.$_core configure -event reset-deassert-pre "quiet_log_push"
        $_TARGETNAME.$_core configure -event reset-deassert-post "quiet_log_pop"
    }

    if {$CONFIG_SMP_ENABLE == 1 && $_cores > 1} {
        echo "SMP enabled: grouping $_cores cores"
        target smp $_TARGETNAME.0 $_TARGETNAME.1
    }

    if {$CONFIG_RTOS_ENABLE == 1} {
        echo "RTOS enabled"
        $_TARGETNAME.0 configure -rtos auto
    }
}

if {$CONFIG_FLASH == 1} {
    flash_id_map_load $ext_flash_map
    set _LOADER $_CHIPNAME.core.1

    $_LOADER configure -work-area-phys 0x61000000 -work-area-size 0x3F000 -work-area-backup 1

    if {$CONFIG_DDR_EN == 1} {
        $_LOADER configure -ddr-enable 1 -loader-buf-start 0x6102D000 -loader-buf-size 0x40000
    } else {
        $_LOADER configure -loader-buf-start 0x6102D000 -loader-buf-size 0x10000
    }

    if {$CONFIG_QSPI != 0} {
        set _FLASHNAME $_CHIPNAME.flash
        flash bank $_FLASHNAME.0 dwcssi_90 0x00000000 0 0 0 $_LOADER 0xf804e000 2 ../loader/qspi_dr1x90
        if {$CONFIG_QSPI == 3} {
            flash bank $_FLASHNAME.1 dwcssi_90 0x02000000 0 0 0 $_LOADER 0xf804e000 2 ../loader/qspi_dr1x90
        }
    }

    if {$CONFIG_NAND == 1} {
        # nand config
        set _NANDNAME $_CHIPNAME.nand
        nand device $_NANDNAME smc35x $_LOADER 0xF841A400
    }

    if {$CONFIG_EMMC != 0 || $CONFIG_EMMC1 != 0} {
        set _EMMC $_CHIPNAME.emmc

        if {$CONFIG_EMMC == 1} {
            # emmc config
            emmc device $_EMMC dwcmshc_90 $_LOADER 0xF8049000 0 6 ../loader/emmc_dr1x90
        }

        if {$CONFIG_EMMC1 == 1} {
            # emmc1 config
            emmc device $_EMMC.1 dwcmshc_90 $_LOADER 0xF804A000 1 6 ../loader/emmc_dr1x90
        }
    }
}

if {$REMOTE_DEBUG == 1} {
bindto 0.0.0.0
}
