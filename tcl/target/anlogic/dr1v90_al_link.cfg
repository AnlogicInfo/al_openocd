#
# DR1V90 Configuration for AL-LINK Adapter
#
# Usage:
#   openocd -f target/anlogic/dr1v90_al_link.cfg
#

source [find /target/anlogic/init.cfg]

set CONFIG_TARGET_RV 1

adapter driver al_link
al_link_vid_pid 0x336C 0x1001

if {[info exists USB_LOCATION]} {
    adapter usb location $USB_LOCATION
}

if {[info exists JTAG_SPEED]} {
    adapter speed $JTAG_SPEED
} else {
    adapter speed 2000
}

transport select jtag
reset_config srst_only

if { [info exists CHIPNAME] } {
  set _CHIPNAME $CHIPNAME
} else {
  set _CHIPNAME dr1v90
}

if {$CONFIG_JTAG == 0} {
    jtag newtap $_CHIPNAME rpu -irlen 5 -ircapture 0x1 -irmask 0x03 -expected-id 0x1c900a6d -enable
    jtag newtap $_CHIPNAME dummy -irlen 4 -ircapture 0x1 -irmask 0xf
    jtag newtap $_CHIPNAME rsv -irlen 4 -ircapture 0x1 -irmask 0xf
    jtag newtap $_CHIPNAME fpga -irlen 8 -ircapture 0xC5 -irmask 0xFF
} elseif {$CONFIG_JTAG == 1} {
    jtag newtap $_CHIPNAME rpu -irlen 5 -expected-id 0x1c900a6d
}

pld device dr1_90 $_CHIPNAME.fpga

target create $_CHIPNAME.pstap pstap -chain-position $_CHIPNAME.rsv

if {$CONFIG_TARGET_RV == 1} {
    echo "target rv"
    set _TARGETNAME $_CHIPNAME.rpu
    target create $_TARGETNAME riscv -chain-position $_CHIPNAME.rpu
    riscv expose_csrs 416-496,770-800,835-850,1227-1231,1483-1486,1984-2032,2064-2070,2370-2380,2490-2500,4032-4040
    # We must turn on this because otherwise the IDE version debug cannot download the program into flash
    riscv set_enable_virt2phys off

    $_TARGETNAME configure -event reset-assert-pre {
        echo "Reseting: dr1v90.rpu"
    }
}

if {$CONFIG_FLASH == 1} {
    flash_id_map_load $ext_flash_map
    set _LOADER $_CHIPNAME.rpu

    echo $_LOADER

    $_LOADER configure -work-area-phys 0x61000000 -work-area-size 0x3F000 -work-area-backup 1
    if {$CONFIG_DDR_EN == 1} {
        $_LOADER configure -ddr-enable 1 -loader-buf-start 0x6102D000 -loader-buf-size 0x40000
    } else {
        $_LOADER configure -loader-buf-start 0x6102D000 -loader-buf-size 0x10000
    }

    if {$CONFIG_QSPI != 0} {
        set _FLASHNAME $_CHIPNAME.flash
        flash bank $_FLASHNAME.0 dwcssi_90 0x00000000 0 0 0 $_LOADER 0xf804e000 2 ../loader/qspi_dr1x90
        if {$CONFIG_QSPI == 3} {
            flash bank $_FLASHNAME.1 dwcssi_90 0x02000000 0 0 0 $_LOADER 0xf804e000 2 ../loader/qspi_dr1x90
        }
    }

    if {$CONFIG_NAND == 1} {
        # nand config
        set _NANDNAME $_CHIPNAME.nand
        nand device $_NANDNAME smc35x $_LOADER 0xF841A400
    }

    if {$CONFIG_EMMC != 0 || $CONFIG_EMMC1 != 0} {
        if {$CONFIG_DDR_EN == 1} {
            $_LOADER configure -ddr-enable 1 -loader-buf-start 0x6102D000 -loader-buf-size 0x40000
        } else {
            $_LOADER configure -loader-buf-start 0x6102D000 -loader-buf-size 0x10000
        }

        set _EMMC $_CHIPNAME.emmc

        if {$CONFIG_EMMC == 1} {
            # emmc config
            emmc device $_EMMC dwcmshc_90 $_LOADER 0xF8049000 0 6 ../loader/emmc_dr1x90
        }

        if {$CONFIG_EMMC1 == 1} {
            # emmc1 config
            emmc device $_EMMC.1 dwcmshc_90 $_LOADER 0xF804A000 1 6 ../loader/emmc_dr1x90
        }
    }
}

if {$REMOTE_DEBUG == 1} {
bindto 0.0.0.0
}